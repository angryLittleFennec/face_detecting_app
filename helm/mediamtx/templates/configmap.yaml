apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-config
data:
  mediamtx.yml: |
    protocols: [tcp]
    rtspAddress: :8554
    readTimeout: 10s
    writeTimeout: 10s
    writeQueueSize: 1024
    udpMaxPayloadSize: 1472
    paths:
      stream3:
        runOnInit: "ffmpeg -re -stream_loop -1 -i /media/videos/video3.mp4 -c:v libx264 -preset veryfast -b:v 2000k -maxrate 2000k -bufsize 4000k -g 30 -profile:v baseline -pix_fmt yuv420p -f rtsp -rtsp_transport tcp rtsp://localhost:8554/mediamtx/stream3"
        runOnInitRestart: yes
      all_others:
